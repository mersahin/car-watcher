name: deploy-bot

# Telegram komut botunu (worker/) Cloudflare'e kurar ve Telegram webhook'unu ona bağlar.
# Gerekli secret'lar: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY,
# BOT_GITHUB_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CFA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEM: ${{ secrets.GEMINI_API_KEY }}
          GHT: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$CF" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CFA" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GEM" ] || missing="$missing GEMINI_API_KEY"
          [ -n "$GHT" ] || missing="$missing BOT_GITHUB_TOKEN"
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Kurulum bitmeden gelen push'lar kırmızı yanmasın; elle tetiklenirse hata ver.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::Bot kurulmadı, eksik secret:$missing (README → Telegram komut botu)"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::Eksik secret:$missing"; exit 1

      # Webhook sırrı her deploy'da yenilenir: aynı adımda hem Worker'a hem Telegram'a verilir.
      - name: Generate webhook secret
        if: steps.check.outputs.ready == 'true'
        id: hook
        run: |
          v=$(openssl rand -hex 32)
          echo "::add-mask::$v"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            TELEGRAM_BOT_TOKEN
            ALLOWED_CHAT_ID
            GEMINI_API_KEY
            GH_TOKEN
            WEBHOOK_SECRET
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          WEBHOOK_SECRET: ${{ steps.hook.outputs.value }}

      - name: Point Telegram webhook at the worker
        if: steps.check.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ steps.hook.outputs.value }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          OUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          [ -n "$URL" ] || URL=$(printf '%s' "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          [ -n "$URL" ] || { echo "::error::Worker URL'si bulunamadı"; exit 1; }
          echo "Worker: $URL"
          curl -fsS "https://api.telegram.org/bot$TOKEN/setWebhook" \
            --data-urlencode "url=$URL" \
            --data-urlencode "secret_token=$SECRET" \
            --data-urlencode 'allowed_updates=["message"]' \
            -d drop_pending_updates=true
          echo
          curl -fsS "https://api.telegram.org/bot$TOKEN/getWebhookInfo" | python3 -c 'import json,sys; i=json.load(sys.stdin)["result"]; print("webhook:", i.get("url"), "| son hata:", i.get("last_error_message", "yok"))'
