name: car-watcher

on:
  schedule:
    # UTC! Berlin = UTC+1/+2 → yerel ~07:00-23:00 arası, saatte bir
    - cron: "0 5-21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece örnek bildirim gönder (butonları denemek için)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: car-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py ${{ inputs.test && '--test' || '' }}

      - name: Commit state
        run: |
          git config user.name "car-watcher"
          git config user.email "car-watcher@users.noreply.github.com"
          git add state.json
          # Bot arada searches.json'u commitlemiş olabilir: önce üstüne al, sonra pushla.
          git diff --staged --quiet || (git commit -m "state: $(date -u +%F_%H:%M)" && git pull --rebase -q && git push)
